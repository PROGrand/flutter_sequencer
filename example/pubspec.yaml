name: flutter_sequencer_example
description: Demonstrates how to use the flutter_sequencer plugin.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: '>=3.11.5 <4.0.0'

dependencies:
  async:
  cupertino_icons:
  flutter:
    sdk: flutter
  flutter_sequencer:
    path: ../

dev_dependencies:
  flutter_lints:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/sfz/
    - assets/sfz/samples/
    - assets/sf2/
    - assets/wav/
